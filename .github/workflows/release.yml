name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          # the automatic npm cache lookup runs the runner's npm inside the
          # workspace, which fails the devEngines check before our pinned npm
          # is installed
          package-manager-cache: false

      - name: Use npm from devEngines
        shell: bash
        run: |
          version="$(node -p "require('./package.json').devEngines.packageManager.version")"
          cd "$RUNNER_TEMP" && npm install -g "npm@$version"

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Publish
        run: npm publish --provenance --access public

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
